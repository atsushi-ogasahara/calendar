<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        const lang = (navigator.language || navigator.userLanguage).toLowerCase().slice(0, 2);
        const supportedLangs = ['ja', 'en', 'fr', 'de', 'es', 'it'];

        const targetLang = supportedLangs.includes(lang) ? lang : 'en';
        window.location.href = `./${targetLang}/index.html` + window.location.hash;
    </script>
</head>
<body>
</body>
</html>
