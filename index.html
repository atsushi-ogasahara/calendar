<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Grid Calendar</title>
    <style>
        :root {
            --border-main: #eef1f3; --border-sub: #e9e9e9;
            --bg-body: #ffffff; --bg-card: #ffffff; --bg-header: #fafbfc;
            --text-main: #444a50; 
            --bg-sun-holiday: #ffebee; 
            --bg-sat: #e3f2fd; 
            --color-sun-holiday: #d32f2f; 
            --color-sat: #1976d2; --btn-gray: #aab2b9; --panel-bg: #ffffff;
            --bg-today: #c8e6c9; --text-today: #2e7d32;
        }
        [data-theme="dark"] {
            --bg-body: #121416; --bg-card: #1c1e22; --bg-header: #24272b;
            --text-main: #d1d2d5; --border-main: #2d3136; --border-sub: #24272b;
            --bg-sun-holiday: #3c1e1e; --bg-sat: #1a2a3a; 
            --color-sun-holiday: #ff8a80; --color-sat: #64b5f6;
            --btn-gray: #5a626a; --panel-bg: #1c1e22;
            --bg-today: #1b3a24; --text-today: #a5d6a7;
        }

        html, body { 
            margin: 0; padding: 0; background: var(--bg-body); 
            font-family: "Helvetica Neue", Arial, sans-serif; 
            color: var(--text-main); transition: 0.3s; 
        }
        
        .top-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--bg-body); opacity: 0.95; backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid var(--border-main); z-index: 1500; gap: 20px;
            padding: 0 10px; box-sizing: border-box;
        }
        .year-display-top { 
            font-size: 1.8rem; font-weight: 700; color: var(--btn-gray); letter-spacing: 4px; 
            min-width: 100px; text-align: center; cursor: pointer; transition: 0.2s;
            padding: 5px 10px; border-radius: 8px;
        }
        .year-display-top:hover { background: var(--bg-header); color: var(--text-main); }

        .header-btn {
            background: transparent; border: 1.5px solid var(--border-main); color: var(--btn-gray);
            padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
            white-space: nowrap;
        }

        /* 年選択モーダル */
        .year-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            width: 260px; max-height: 400px; background: var(--panel-bg);
            border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 3000; display: none; flex-direction: column; opacity: 0; transition: 0.2s;
        }
        .year-modal.show { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .year-modal-header { padding: 15px; text-align: center; font-weight: 700; border-bottom: 1px solid var(--border-main); color: var(--btn-gray); font-size: 0.9rem;}
        .year-list { overflow-y: auto; flex-grow: 1; padding: 5px 0; }
        .year-item { padding: 10px; text-align: center; cursor: pointer; font-size: 1.1rem; transition: 0.1s; font-weight: 500;}
        .year-item:hover { background: var(--bg-header); color: var(--color-sat); }
        .year-item.active { font-weight: 700; color: var(--color-sat); background: var(--bg-sat); }
        .year-modal-footer { padding: 12px; border-top: 1px solid var(--border-main); text-align: center; }
        .modal-close-btn { background: var(--btn-gray); color: #fff; border: none; padding: 8px 24px; border-radius: 20px; cursor: pointer; font-size: 0.75rem; font-weight: 600;}

        .main-wrapper { padding: 90px 4% 60px 4%; max-width: 1800px; margin: 0 auto; }
        .menu-icon { position: fixed; top: 15px; right: 15px; width: 40px; height: 40px; background: var(--btn-gray); color: #fff; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; z-index: 2000; gap: 5px; opacity: 0.9; }
        .menu-icon span { width: 20px; height: 2px; background: #fff; }
        
        .side-panel { position: fixed; top: 0; right: -320px; width: 320px; height: 100%; background: var(--panel-bg); box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: 0.3s; z-index: 1900; padding: 80px 25px; box-sizing: border-box; overflow-y: auto;}
        .side-panel.open { right: 0; }
        .panel-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; z-index: 1800; }
        .panel-overlay.show { display: block; }
        
        .menu-label { font-weight: bold; font-size: 0.75rem; color: var(--btn-gray); margin-bottom: 12px; display: block; border-bottom: 2px solid var(--border-main); padding-bottom: 5px; }
        .btn-toggle { background: var(--bg-body); border: 1.5px solid var(--border-main); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 600; flex-grow: 1; color: var(--text-main); min-width: 60px; }
        .btn-toggle.active { background: var(--btn-gray); color: #fff; border-color: var(--btn-gray); }

        .year-container { display: grid; grid-template-columns: repeat(4, 1fr); border-left: 2.5px solid var(--border-main); border-top: 2.5px solid var(--border-main); }
        .month-card { background: var(--bg-card); border-right: 2.5px solid var(--border-main); border-bottom: 2.5px solid var(--border-main); }
        .month-title { text-align: center; font-weight: 700; background: var(--bg-header); padding: 12px 0; font-size: 1rem; border-bottom: 2px solid var(--border-main); color: var(--btn-gray); letter-spacing: 2px; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { font-size: 0.6rem; color: #abb2b9; padding: 8px 0; border-right: 1.5px solid var(--border-sub); border-bottom: 1.5px solid var(--border-sub); background: var(--bg-header); font-weight: 600; }
        td { text-align: center; height: 55px; border-right: 1.5px solid var(--border-sub); border-bottom: 1.5px solid var(--border-sub); position: relative; }
        .date-num { font-size: 1rem; font-weight: 500; display: block; }
        .rokuyo { font-size: 0.55rem; opacity: 0.6; display: block; margin-top: 2px; }

        .bg-sat { background-color: var(--bg-sat); color: var(--color-sat); }
        .bg-sun-holiday { background-color: var(--bg-sun-holiday); color: var(--color-sun-holiday); }

        .today-cell { 
            background-color: var(--bg-today) !important; 
            color: var(--text-today) !important;
            font-weight: 700;
        }
        .today-cell .date-num, .today-cell .rokuyo { color: var(--text-today) !important; }

        .holiday-list-section { padding: 40px 0; border-top: 2.5px solid var(--border-main); margin-top: 30px; }
        .holiday-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; font-size: 0.85rem; }
        .holiday-item { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border-sub); }
        .holiday-date { font-weight: 700; color: var(--color-sun-holiday); margin-right: 12px; padding-right: 10px; border-right: 2px solid var(--border-sub); min-width: 60px; text-align: center; }

        @media (max-width: 1200px) { .year-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { 
            .year-container { grid-template-columns: 1fr; } 
            .year-display-top { font-size: 1.4rem; letter-spacing: 2px; min-width: 80px; }
            .header-btn { padding: 6px 10px; font-size: 0.7rem; }
            .top-header { gap: 10px; height: 60px; }
            .main-wrapper { padding-top: 80px; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <button class="header-btn" id="prevBtn"></button>
    <div class="year-display-top" id="yearDisplayTop" onclick="openYearModal()"></div>
    <button class="header-btn" id="nextBtn"></button>
</header>

<div class="year-modal" id="yearModal">
    <div class="year-modal-header" id="modalTitle"></div>
    <div class="year-list" id="yearList"></div>
    <div class="year-modal-footer">
        <button class="modal-close-btn" id="modalCloseBtn" onclick="closeYearModal()"></button>
    </div>
</div>

<div class="menu-icon" onclick="toggleMenu()"><span></span><span></span><span></span></div>
<div class="panel-overlay" id="overlay" onclick="handleOverlayClick()"></div>

<div class="side-panel" id="sidePanel">
    <div class="menu-section"><span class="menu-label">MODE</span><div class="btn-group"><button id="themeLight" class="btn-toggle active" onclick="setTheme('light')">Light</button><button id="themeDark" class="btn-toggle" onclick="setTheme('dark')">Dark</button></div></div>
    <div class="menu-section"><span class="menu-label">LANGUAGE</span><div class="btn-group" id="langSelector">
        <button class="btn-toggle active" onclick="setLang('ja')">JP</button>
        <button class="btn-toggle" onclick="setLang('en')">EN</button>
        <button class="btn-toggle" onclick="setLang('fr')">FR</button>
        <button class="btn-toggle" onclick="setLang('de')">DE</button>
        <button class="btn-toggle" onclick="setLang('es')">ES</button>
        <button class="btn-toggle" onclick="setLang('it')">IT</button>
    </div></div>
    <div class="menu-section"><span class="menu-label">WEEK START</span><div class="btn-group"><button id="startSun" class="btn-toggle active" onclick="setStartDay(0)">Sun</button><button id="startMon" class="btn-toggle" onclick="setStartDay(1)">Mon</button></div></div>
    <div class="menu-section" id="rokuyoMenu"><span class="menu-label">ROKUYO</span><div class="btn-group"><button id="rokuyoOn" class="btn-toggle" onclick="toggleRokuyo(true)">ON</button><button id="rokuyoOff" class="btn-toggle active" onclick="toggleRokuyo(false)">OFF</button></div></div>
</div>

<div class="main-wrapper">
    <div class="year-container" id="yearContainer"></div>
    <div class="holiday-list-section"><h3 id="holidayListTitle" style="margin-bottom:20px; font-size:1.1rem; color:var(--btn-gray);"></h3><div class="holiday-grid" id="holidayGrid"></div></div>
</div>

<script>
    let currentYear = new Date().getFullYear();
    let currentLang = 'ja';
    let startDayOfWeek = 0;
    let showRokuyo = false;

    const i18n = {
        ja: { labels: ["モード","言語","週開始","六曜","祝日一覧"], nav: ["前年","次年"], modal: ["年を選択","キャンセル"], days: ["日","月","火","水","木","金","土"], months: m=>`${m+1}月` },
        en: { labels: ["THEME","LANGUAGE","WEEK START","ROKUYO","Holiday List"], nav: ["Prev Year","Next Year"], modal: ["Select Year","Cancel"], days: ["SUN","MON","TUE","WED","THU","FRI","SAT"], months: m=>["January","February","March","April","May","June","July","August","September","October","November","December"][m] },
        fr: { labels: ["MODE","LANGUE","DÉBUT","ROKUYO","Jours fériés"], nav: ["Année préc.","Année suiv."], modal: ["Choisir l'année","Annuler"], days: ["DIM","LUN","MAR","MER","JEU","VEN","SAM"], months: m=>["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"][m] },
        de: { labels: ["MODUS","SPRACHE","START","ROKUYO","Feiertage"], nav: ["Vorheriges Jahr","Nächstes Jahr"], modal: ["Jahr wählen","Abbrechen"], days: ["SO","MO","DI","MI","DO","FR","SA"], months: m=>["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][m] },
        es: { labels: ["MODO","IDIOMA","INICIO","ROKUYO","Lista de festivos"], nav: ["Año anterior","Año siguiente"], modal: ["Elegir año","Cancelar"], days: ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"], months: m=>["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m] },
        it: { labels: ["MODO","LINGUA","INIZIO","ROKUYO","Festività"], nav: ["Anno prec.","Anno succ."], modal: ["Scegli anno","Annulla"], days: ["DOM","LUN","MAR","MER","GIO","VEN","SAB"], months: m=>["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"][m] }
    };

    function openYearModal() {
        const modal = document.getElementById('yearModal');
        const list = document.getElementById('yearList');
        const overlay = document.getElementById('overlay');
        const t = i18n[currentLang];
        document.getElementById('modalTitle').textContent = t.modal[0];
        document.getElementById('modalCloseBtn').textContent = t.modal[1];
        list.innerHTML = '';
        for(let i = currentYear - 50; i <= currentYear + 50; i++) {
            const item = document.createElement('div');
            item.className = 'year-item' + (i === currentYear ? ' active' : '');
            item.textContent = i;
            item.onclick = () => { currentYear = i; renderCalendar(); closeYearModal(); };
            list.appendChild(item);
            if(i === currentYear) setTimeout(() => item.scrollIntoView({block: 'center'}), 10);
        }
        modal.classList.add('show'); overlay.classList.add('show');
    }

    function closeYearModal() {
        document.getElementById('yearModal').classList.remove('show');
        document.getElementById('overlay').classList.remove('show');
    }

    function handleOverlayClick() {
        closeYearModal(); document.getElementById('sidePanel').classList.remove('open');
    }

    function getHolidays(y) {
        const h = {};
        const add = (m,d,n) => { 
            const key = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            h[key] = n; 
        };
        const data = [
            {m:1, d:1, ja:"元日", en:"New Year", fr:"Nouvel An", de:"Neujahr", es:"Año Nuevo", it:"Capodanno"},
            {m:2, d:11, ja:"建国記念の日", en:"Foundation Day", fr:"Fondation", de:"Gründungstag", es:"Fundación", it:"Fondazione"},
            {m:2, d:23, ja:"天皇誕生日", en:"Emperor's Birthday", fr:"Anniv. Empereur", de:"Kaisergeburtstag", es:"Cumpleaños Emp.", it:"Comp. Imperatore"},
            {m:4, d:29, ja:"昭和の日", en:"Showa Day", fr:"Jour Showa", de:"Showa-Tag", es:"Día Showa", it:"Giorno Showa"},
            {m:5, d:3, ja:"憲法記念日", en:"Constitution Day", fr:"Fête Const.", de:"Verfassungstag", es:"Día Const.", it:"Festa Cost."},
            {m:5, d:4, ja:"みどりの日", en:"Greenery Day", fr:"Jour de Verdure", de:"Grüner Tag", es:"Día Verdor", it:"Giorno Verde"},
            {m:5, d:5, ja:"こどもの日", en:"Children's Day", fr:"Fête Enfants", de:"Kindertag", es:"Día Niño", it:"Giorno Bimbi"},
            {m:8, d:11, ja:"山の日", en:"Mountain Day", fr:"Jour de Montagne", de:"Berg-Tag", es:"Día Montaña", it:"Giorno Montagna"},
            {m:11, d:3, ja:"文化の日", en:"Culture Day", fr:"Jour Culture", de:"Tag der Kultur", es:"Día Cultura", it:"Giorno Cultura"},
            {m:11, d:23, ja:"勤労感謝の日", en:"Labor Day", fr:"Fête Travail", de:"Tag der Arbeit", es:"Día Trabajo", it:"Festa Lavoro"}
        ];
        data.forEach(item => add(item.m, item.d, item));
        const happy = (m, n, ja, en, fr, de, es, it) => {
            let d = 1 + (7 - new Date(y, m-1, 1).getDay() + 1) % 7 + (n-1)*7;
            add(m, d, {ja, en, fr, de, es, it});
        };
        happy(1, 2, "成人の日", "Coming of Age", "Majorité", "Volljährigkeit", "Mayoría", "Maggiore Età");
        happy(7, 3, "海の日", "Marine Day", "Jour Mer", "Meertag", "Día Mar", "Giorno Mare");
        happy(9, 3, "敬老の日", "Respect for Aged", "Respect Aînés", "Seniorentag", "Respeto Mayores", "Rispetto Anziani");
        happy(10, 2, "スポーツの日", "Sports Day", "Sport", "Sporttag", "Deporte", "Sport");
        const shun = Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
        const shub = Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
        add(3, shun, {ja:"春分の日", en:"Equinox", fr:"Équinoxe", de:"Äquinoktium", es:"Equinoccio", it:"Equinozio"});
        add(9, shub, {ja:"秋分の日", en:"Equinox", fr:"Équinoxe", de:"Herbst-Äq.", es:"Equinoccio", it:"Equinozio"});
        Object.keys(h).sort().forEach(k => {
            let d = new Date(k); if(d.getDay() === 0) {
                let n = new Date(d); let nk;
                do { n.setDate(n.getDate()+1); nk = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; } while(h[nk]);
                h[nk] = {ja:"振替休日", en:"Sub. Hol.", fr:"Remplaçant", de:"Ersatz", es:"Sustituto", it:"Sostituto"};
            }
        });
        return h;
    }

    function getRokuyo(y,m,d) {
        const list = ["大安","赤口","先勝","友引","先負","仏滅"];
        return list[(Math.floor((new Date(y,m,d)-new Date(2020,0,1))/86400000)+4)%6];
    }

    function renderCalendar() {
        const t = i18n[currentLang];
        document.getElementById('yearDisplayTop').textContent = currentYear;
        document.getElementById('prevBtn').textContent = t.nav[0];
        document.getElementById('nextBtn').textContent = t.nav[1];
        const labels = document.querySelectorAll('.menu-label');
        t.labels.forEach((l,i) => { if(labels[i]) labels[i].textContent = l; });
        document.getElementById('holidayListTitle').textContent = t.labels[4];
        const container = document.getElementById('yearContainer');
        const hGrid = document.getElementById('holidayGrid');
        container.innerHTML = ''; hGrid.innerHTML = '';
        const holidays = getHolidays(currentYear);
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        for (let m=0; m<12; m++) {
            const card = document.createElement('div');
            card.className = 'month-card';
            let html = `<div class="month-title">${t.months(m)}</div><table><thead><tr>`;
            for (let i=0; i<7; i++) {
                let idx = (i+startDayOfWeek)%7;
                html += `<th class="${idx===0?'bg-sun-holiday':(idx===6?'bg-sat':'')}">${t.days[idx]}</th>`;
            }
            html += `</tr></thead><tbody>`;
            let first = new Date(currentYear, m, 1).getDay();
            let last = new Date(currentYear, m+1, 0).getDate();
            let offset = (first - startDayOfWeek + 7) % 7;
            let d = 1;
            for (let r=0; r<6; r++) {
                html += `<tr>`;
                for (let c=0; c<7; c++) {
                    let cellIdx = r*7 + c;
                    if(cellIdx < offset || d > last) html += `<td></td>`;
                    else {
                        let key = `${currentYear}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        let dow = (cellIdx + startDayOfWeek)%7;
                        let cls = (holidays[key] || dow===0)?'bg-sun-holiday':(dow===6?'bg-sat':'');
                        if(key === todayStr) cls += ' today-cell';
                        html += `<td class="${cls}"><span class="date-num">${d}</span>`;
                        if(showRokuyo && currentLang==='ja') html += `<span class="rokuyo">${getRokuyo(currentYear, m, d)}</span>`;
                        html += `</td>`; d++;
                    }
                }
                html += `</tr>`; if(d > last) break;
            }
            card.innerHTML = html + `</tbody></table>`;
            container.appendChild(card);
        }
        Object.keys(holidays).sort().forEach(k => {
            const [y,m,d] = k.split('-');
            hGrid.innerHTML += `<div class="holiday-item"><span class="holiday-date">${m}/${d}</span><span>${holidays[k][currentLang]}</span></div>`;
        });
    }

    function toggleMenu() { document.getElementById('sidePanel').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }
    function setTheme(m) { document.documentElement.setAttribute('data-theme', m); document.getElementById('themeLight').classList.toggle('active', m==='light'); document.getElementById('themeDark').classList.toggle('active', m==='dark'); }
    function setLang(l) { 
        currentLang = l;
        document.querySelectorAll('#langSelector .btn-toggle').forEach(b => {
            const txt = b.textContent;
            b.classList.toggle('active', (l==='ja'&&txt==='JP') || (l==='en'&&txt==='EN') || (txt.toLowerCase()===l));
        });
        document.getElementById('rokuyoMenu').style.display = (l==='ja' ? 'block' : 'none');
        renderCalendar(); 
    }
    function setStartDay(d) { startDayOfWeek = d; document.getElementById('startSun').classList.toggle('active', d===0); document.getElementById('startMon').classList.toggle('active', d===1); renderCalendar(); }
    function toggleRokuyo(b) { showRokuyo = b; document.getElementById('rokuyoOn').classList.toggle('active', b); document.getElementById('rokuyoOff').classList.toggle('active', !b); renderCalendar(); }

    document.getElementById('prevBtn').onclick = () => { currentYear--; renderCalendar(); };
    document.getElementById('nextBtn').onclick = () => { currentYear++; renderCalendar(); };
    renderCalendar();
</script>
</body>
</html>
