<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="pPW5P428T-qloPdu_Ho_XZSA3aO-B0L-JEX5rXoj-fU" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fazzCalendar - IT</title>
    <meta id="meta-description" name="description" content="Calendario online semplice. Visualizza rapidamente le date del calendario, le festività imminenti e i giorni della settimana nel tuo browser.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../images/favicon.ico">
    <link rel="canonical" href="https://fazzcalendar.netlify.app/it/">
    <link rel="alternate" hreflang="ja" href="https://fazzcalendar.netlify.app/ja/" />
    <link rel="alternate" hreflang="en" href="https://fazzcalendar.netlify.app/en/" />
    <link rel="alternate" hreflang="fr" href="https://fazzcalendar.netlify.app/fr/" />
    <link rel="alternate" hreflang="de" href="https://fazzcalendar.netlify.app/de/" />
    <link rel="alternate" hreflang="es" href="https://fazzcalendar.netlify.app/es/" />
    <link rel="alternate" hreflang="it" href="https://fazzcalendar.netlify.app/it/" />
    <link rel="alternate" hreflang="x-default" href="https://fazzcalendar.netlify.app/en/" />
</head>
<body>
    <header class="top-header">
        <button class="header-btn" id="prevBtn"></button>
        <div class="year-display-top" id="yearDisplayTop" onclick="openYearModal()"></div>
        <button class="header-btn" id="nextBtn"></button>
    </header>

    <div class="year-modal" id="yearModal">
        <div class="year-modal-header" id="modalTitle"></div>
        <div class="year-list" id="yearList"></div>
        <div class="year-modal-footer">
            <button class="modal-close-btn" id="modalCloseBtn" onclick="closeYearModal()"></button>
        </div>
    </div>

    <div class="menu-icon" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    <div class="panel-overlay" id="overlay" onclick="handleOverlayClick()"></div>

    <div class="side-panel" id="sidePanel">
        <div class="menu-section">
            <span class="menu-label">MODE</span>
            <div class="btn-group">
                <button id="themeLight" class="btn-toggle" onclick="updateURLParam('theme', 'light')">Light</button>
                <button id="themeDark" class="btn-toggle" onclick="updateURLParam('theme', 'dark')">Dark</button>
            </div>
        </div>
        <div class="menu-section">
            <span class="menu-label">LANGUAGE</span>
            <div class="btn-group" id="langSelector">
                <a href="../it/" class="btn-toggle btn-lang" onclick="navigateLanguage(event, 'it')">IT</a>
                <a href="../ja/" class="btn-toggle btn-lang" onclick="navigateLanguage(event, 'ja')">JP</a>
                <a href="../en/" class="btn-toggle btn-lang" onclick="navigateLanguage(event, 'en')">EN</a>
                <a href="../fr/" class="btn-toggle btn-lang" onclick="navigateLanguage(event, 'fr')">FR</a>
                <a href="../de/" class="btn-toggle btn-lang" onclick="navigateLanguage(event, 'de')">DE</a>
                <a href="../es/" class="btn-toggle btn-lang" onclick="navigateLanguage(event, 'es')">ES</a>
            </div>
        </div>
        <div class="menu-section">
            <span class="menu-label">WEEK START</span>
            <div class="btn-group">
                <button id="startSun" class="btn-toggle" onclick="updateURLParam('start', '0')">Sun</button>
                <button id="startMon" class="btn-toggle" onclick="updateURLParam('start', '1')">Mon</button>
            </div>
        </div>
        <div class="menu-section" id="rokuyoMenu">
            <span class="menu-label">ROKUYO</span>
            <div class="btn-group">
                <button id="rokuyoOn" class="btn-toggle" onclick="updateURLParam('rokuyo', 'true')">ON</button>
                <button id="rokuyoOff" class="btn-toggle" onclick="updateURLParam('rokuyo', 'false')">OFF</button>
            </div>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="year-container" id="yearContainer"></div>
        <div class="holiday-list-section"><h3 id="holidayListTitle" style="margin-bottom:20px; font-size:1.1rem; color:var(--btn-gray);"></h3><div class="holiday-grid" id="holidayGrid"></div></div>
    </div>

    <script>
        (function() {
            const thisYear = new Date().getFullYear(); 
            document.title = `Calendario ${thisYear} IT`;
            const descText = `Calendario online semplice per l'anno ${thisYear}. Visualizza rapidamente le date del calendario, le festività imminenti e i giorni della settimana nel tuo browser.`;
            document.getElementById('meta-description').setAttribute('content', descText);
        })();
    </script>
    <script src="../javascript/calendar.js"></script>
</body>
</html>
